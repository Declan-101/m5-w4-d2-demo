<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quicksort example</title>

</head>
<body>
    <p>Quicksort example </p>
        <script>
            const smArr = [37, 29, 30];
            const bigArr = [43, 59, 29, 18];

            const sort = arr => {
                if (arr.length < 2) return arr;

                let pivot = arr[0];
                let left = [];
                let right = [];

                for (let i = 1, total = arr.length; i < total; i++) {
                    if (arr[i] < pivot) left.push(arr[i]);
                    else right.push(arr[i]);
                };
                return [
                    ...sort(left),
                    pivot,
                    ...sort(right)
                ];
            };
            console.log(sort(smArr)); // 0 Milliseconds
            console.log(sort(bigArr)); // 1 Millisecond
        </script>


<pre id="output"></pre><p>Quicksort averages O(n log n); its worst case is O(n²).</p><a href="index.html">All demos</a><script>document.getElementById('output').textContent = 'smArr: ' + JSON.stringify(smArr) + '\nSorted: ' + JSON.stringify(sort(smArr)) + '\n\nbigArr: ' + JSON.stringify(bigArr) + '\nSorted: ' + JSON.stringify(sort(bigArr));</script></body>
</html>
